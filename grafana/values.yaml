# Demo-grade values: single replicas, no persistence, no auth.
# fullnameOverride gives stable service names regardless of release name.

# ---------------------------------------------------------------- Prometheus
prometheus:
  fullnameOverride: prometheus          # not applied to the server: svc is grafana-prometheus-server:80
  alertmanager:
    enabled: true 
  prometheus-pushgateway:
    enabled: true 
  server:
    persistentVolume:
      enabled: false
    global:
      scrape_interval: 15s              # how often every target is scraped (chart default 1m)

# ---------------------------------------------------------------- Loki
loki:
  fullnameOverride: loki                # -> svc/loki-gateway:80
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
  singleBinary:
    replicas: 1
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  minio:
    enabled: false

# ---------------------------------------------------------------- Tempo
tempo:
  fullnameOverride: tempo               # -> svc/tempo: 3200 query, 4317/4318 OTLP
  tempo:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

# ---------------------------------------------------------------- Grafana
grafana:
  fullnameOverride: grafana             # -> svc/grafana:80
  adminPassword: admin
  persistence:
    enabled: false
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Admin                   # demo only
  # Dashboards: the ConfigMaps from templates/dashboards.yaml (one per dashboards/*.json).
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          url: http://grafana-prometheus-server
          isDefault: true
          jsonData:
            timeInterval: 15s         # = prometheus.server.global.scrape_interval: $__rate_interval is then wide enough for rate()
        - name: Loki
          uid: loki
          type: loki
          url: http://loki-gateway
          jsonData:
            derivedFields:            # log -> trace, from the trace_id structured metadata
              - name: TraceID
                matcherType: label
                matcherRegex: trace_id
                url: '$${__value.raw}'
                datasourceUid: tempo
        - name: Tempo
          uid: tempo
          type: tempo
          url: http://tempo:3200
          jsonData:
            tracesToLogsV2:           # trace -> logs: trace_id is structured metadata, not part of the log line
              datasourceUid: loki
              spanStartTimeShift: '-5m'
              spanEndTimeShift: '5m'
              customQuery: true
              query: '{service_name=~".+"} | trace_id="$${__trace.traceId}"'
            serviceMap:
              datasourceUid: prometheus
