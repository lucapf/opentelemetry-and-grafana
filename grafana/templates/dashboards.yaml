{{- /*
  Every dashboard in dashboards/*.json, as a ConfigMap Grafana's sidecar loads
  (grafana.sidecar.dashboards in values.yaml): add a file, `helm upgrade`, it is there.
*/}}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-{{ base $path | trimSuffix ".json" }}
  labels:
    grafana_dashboard: "1"
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
