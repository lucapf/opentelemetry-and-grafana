apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: grafana
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
  ports:
  - name: http
    port: 80
    targetPort: grafana
    nodePort: 3080
---
apiVersion: v1
kind: Service
metadata:
  name: loki-nodeport
  namespace: grafana
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/component: gateway
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 3081
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-nodeport
  namespace: grafana
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/component: server
  ports:
  - name: http
    port: 80
    targetPort: 9090
    nodePort: 3082
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world-example
  namespace: observability-demo
spec:
  type: NodePort
  selector:
    app: hello-world-example
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    nodePort: 3083
