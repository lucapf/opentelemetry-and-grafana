apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hello-world-example
  name: hello-world-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world-example
  strategy: {}
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
      labels:
        app: hello-world-example

    spec:
      containers:
      - image: hello-world:0.0.1
        name: hello-world
        env:
        - name: OTEL_SERVICE_NAME
          value: hello-world
        # - name: OTEL_TRACES_EXPORTER
        #  value: console,otlp # console,otlp
        # - name: OTEL_METRICS_EXPORTER
        #  value: console,otlp #   console 
        # - name: OTEL_EXPORTER_OTLP_ENDPOINT
        #   value: http://localhost:4318
        # - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        #   value: 0.0.0.0:4317

        resources: {}
status: {}
