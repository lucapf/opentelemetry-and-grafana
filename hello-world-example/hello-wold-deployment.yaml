apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hello-world-example
  name: hello-world-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world-example
  strategy: {}
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
      labels:
        app: hello-world-example
    spec:
      containers:
      - image: hello-world:0.0.2
        name: hello-world
        env:
        - name: OTEL_SERVICE_NAME
          value: hello-world
        # libpq connection settings, read by psycopg.connect() (see postgresql.yaml)
        - name: PGHOST
          value: postgres
        - name: PGUSER
          valueFrom:
            secretKeyRef: {name: postgres, key: POSTGRES_USER}
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef: {name: postgres, key: POSTGRES_PASSWORD}
        - name: PGDATABASE
          valueFrom:
            secretKeyRef: {name: postgres, key: POSTGRES_DB}
        resources: {}
status: {}
