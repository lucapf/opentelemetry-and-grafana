apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
spec:
  mode: daemonset
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.160.0
  env:
    - name: POSTGRES_USER
      valueFrom:
        secretKeyRef: {name: postgres, key: POSTGRES_USER}
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef: {name: postgres, key: POSTGRES_PASSWORD}
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8889"
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      postgresql:
        endpoint: postgres.observability-demo.svc.cluster.local:5432
        transport: tcp
        username: ${env:POSTGRES_USER}
        password: ${env:POSTGRES_PASSWORD}
        databases: [urlstore]
        collection_interval: 15s          # how often PostgreSQL is read
        tls:
          insecure: true
    processors:
      # Refers to https://opentelemetry.io/docs/specs/otel/logs/data-model/
      transform/logs:
        error_mode: ignore
        log_statements:
          # Attributes
          - delete_matching_keys(log.attributes, "^code\\.")
          - delete_matching_keys(resource.attributes, "^telemetry\\.")
          - delete_key(resource.attributes, "service.instance.id")
          - delete_key(resource.attributes, "k8s.replicaset.name")
          - delete_key(resource.attributes, "k8s.node.name")
          # Fields
          - set(log.severity_number, SEVERITY_NUMBER_UNSPECIFIED)
          - set(scope.name, "")
    exporters:
      debug:
        verbosity: normal # basic, normal, detailed
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true
      otlp/tempo:
        endpoint: tempo.grafana.svc.cluster.local:4317
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: http://loki-gateway.grafana.svc.cluster.local/otlp

    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug, otlp/tempo]
        metrics:
          receivers: [otlp, postgresql]
          exporters: [debug, prometheus]
        logs:
          receivers: [otlp]
          processors: [transform/logs]
          exporters: [debug, otlphttp/loki]
